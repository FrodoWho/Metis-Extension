<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"></div>
      <span class="title">measure</span>
    </header>
    <div class="tool" data-tool="measure">
      <div class="tool-info">
        <span class="tool-icon">📐</span>
        <span class="tool-name">Measure</span>
      </div>
      <span class="badge">OFF</span>
    </div>
    <div class="tool" data-tool="guides">
      <div class="tool-info">
        <span class="tool-icon">📏</span>
        <span class="tool-name">Guides</span>
      </div>
      <span class="badge">OFF</span>
    </div>
    <div class="guides-sub" id="guides-sub">
      <button class="dir-btn" id="btn-v">V</button>
      <button class="dir-btn" id="btn-h">H</button>
      <div class="sub-spacer"></div>
      <button class="gap-btn" id="btn-gap">Gap</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
